# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# CURSOR
cursor_shape block

# SCROLL
scrollback_lines 10000

# HOTKEYS
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

# URLS
url_style curly
open_url_with firefox
detect_urls yes

# PERFOMANCE
sync_to_monitor yes