general {
    no_fade_in = false
    grace = 0
    disable_loading = false
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor = 
    path = ~/Pictures/leaves.png
    blur_passes = 1
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgba(255, 255, 255, 0.9)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i></i>
    fail_color = rgba(255, 80, 80, 0.8)
    fail_text = <i>Wrong password</i>
    position = 0, -80
    halign = center
    valign = center
}
