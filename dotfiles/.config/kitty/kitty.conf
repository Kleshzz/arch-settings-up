# Catppuccin Mocha

# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# Ligatures
font_features JetBrainsMonoNerdFont-Regular    +liga +calt
font_features JetBrainsMonoNerdFont-Bold       +liga +calt
font_features JetBrainsMonoNerdFont-Italic     +liga +calt
font_features JetBrainsMonoNerdFont-BoldItalic +liga +calt

# Cursor
cursor               #f5e0dc
cursor_text_color    #1e1e2e
cursor_shape          beam
cursor_blink_interval 0
mouse_hide_wait       2.5

# Scrollback
scrollback_lines 2000

# Window
confirm_os_window_close    2
window_padding_width       12 16
dynamic_background_opacity yes
remember_window_size       yes

# Tab bar
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_edge            bottom
active_tab_foreground   #1e1e2e
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244

# Colors
foreground         #cdd6f4
background         #1e1e2e
background_opacity 0.80

# Black
color0  #45475a
color8  #585b70

# Red
color1  #f38ba8
color9  #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #cba6f7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# Hotkeys
map ctrl+v         paste_from_clipboard
map ctrl+shift+c   copy_to_clipboard
map ctrl+t         new_tab_with_cwd
map ctrl+w         close_tab
map ctrl+right     next_tab
map ctrl+left      previous_tab
map ctrl+alt+t     set_tab_title
map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i

# URLs
url_color     #89b4fa
url_style     curly
open_url_with default
detect_urls   yes

# Input
repaint_delay 16
input_delay   8

# Misc
enable_audio_bell     no
strip_trailing_spaces smart
graphics_protocol     none
sync_to_monitor       no
allow_remote_control  yes
